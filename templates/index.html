<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>绩效考核数据处理工具</title>
<style>
  :root {
    --bg: #f0f2f5;
    --card: #ffffff;
    --primary: #4361ee;
    --primary-hover: #3a56d4;
    --success: #2ec4b6;
    --danger: #e63946;
    --text: #2b2d42;
    --muted: #8d99ae;
    --border: #dee2e6;
    --shadow: 0 2px 12px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  .container { max-width: 820px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    margin-bottom: .4rem;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: .9rem;
    margin-bottom: 2rem;
  }

  /* Target file card */
  .target-card {
    background: var(--card);
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: var(--shadow);
    margin-bottom: 1.5rem;
    border-left: 4px solid var(--primary);
  }
  .target-card h2 { font-size: 1.1rem; margin-bottom: .8rem; }

  /* Section cards */
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: var(--shadow);
    margin-bottom: 1.25rem;
    transition: box-shadow .2s;
  }
  .card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.12); }
  .card h2 {
    font-size: 1.05rem;
    margin-bottom: .25rem;
  }
  .card .desc {
    color: var(--muted);
    font-size: .82rem;
    margin-bottom: 1rem;
  }

  /* File inputs */
  .file-row {
    display: flex;
    align-items: center;
    gap: .75rem;
    margin-bottom: .6rem;
    flex-wrap: wrap;
  }
  .file-row label {
    min-width: 140px;
    font-size: .88rem;
    font-weight: 500;
  }
  input[type="file"] {
    flex: 1;
    min-width: 200px;
    font-size: .85rem;
    padding: .35rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fafbfc;
  }
  input[type="file"]::file-selector-button {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: .35rem .8rem;
    border-radius: 4px;
    cursor: pointer;
    font-size: .82rem;
    margin-right: .5rem;
  }
  input[type="file"]::file-selector-button:hover {
    background: var(--primary-hover);
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    padding: .55rem 1.4rem;
    border: none;
    border-radius: 8px;
    font-size: .9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s, transform .1s;
    margin-top: .6rem;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-primary:disabled { background: #a0aec0; cursor: not-allowed; }
  .btn-success { background: var(--success); color: #fff; }

  /* Status messages */
  .status {
    margin-top: .6rem;
    padding: .5rem .8rem;
    border-radius: 6px;
    font-size: .85rem;
    display: none;
  }
  .status.show { display: block; }
  .status.ok { background: #d4edda; color: #155724; }
  .status.err { background: #f8d7da; color: #721c24; }
  .status.loading { background: #fff3cd; color: #856404; }

  /* All-in-one section */
  .divider {
    text-align: center;
    color: var(--muted);
    font-size: .8rem;
    margin: 1.5rem 0;
    position: relative;
  }
  .divider::before, .divider::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 35%;
    height: 1px;
    background: var(--border);
  }
  .divider::before { left: 0; }
  .divider::after { right: 0; }
</style>
</head>
<body>
<div class="container">
  <h1>绩效考核数据处理工具</h1>
  <p class="subtitle">上传考核文件，自动处理并更新汇总表</p>

  <!-- Target file -->
  <div class="target-card">
    <h2>目标文件</h2>
    <div class="file-row">
      <label>选择文件</label>
      <input type="file" id="targetFile" accept=".xlsx,.xls">
    </div>
    <div class="file-row" style="margin-top:.4rem">
      <label>下载文件名</label>
      <input type="text" id="downloadName" placeholder="output.xlsx"
             style="flex:1;min-width:200px;font-size:.85rem;padding:.45rem .6rem;
                    border:1px solid var(--border);border-radius:6px;background:#fafbfc;">
    </div>
  </div>

  <!-- Section 1: Department Evaluation -->
  <div class="card">
    <h2>1. 部门绩效考核</h2>
    <p class="desc">上传部门考核评定表（普通 + 领导），计算综合评定写入「部门绩效考核」表</p>
    <div class="file-row">
      <label>部门考核评定表</label>
      <input type="file" id="deptRegular" accept=".xlsx,.xls">
    </div>
    <div class="file-row">
      <label>领导评定表</label>
      <input type="file" id="deptLeader" accept=".xlsx,.xls">
    </div>
    <button class="btn btn-primary" onclick="processDept()">处理部门绩效考核</button>
    <div class="status" id="statusDept"></div>
  </div>

  <!-- Section 2: Middle Management -->
  <div class="card">
    <h2>2. 部门副职考核</h2>
    <p class="desc">上传中层副职考核评定表，计算A/B评定写入「部门副职考核」表</p>
    <div class="file-row">
      <label>中层副职评定表</label>
      <input type="file" id="mgmtFile" accept=".xlsx,.xls">
    </div>
    <button class="btn btn-primary" onclick="processMgmt()">处理副职考核</button>
    <div class="status" id="statusMgmt"></div>
  </div>

  <!-- Section 3: Employee Rating -->
  <div class="card">
    <h2>3. 绩效考评汇总</h2>
    <p class="desc">上传员工等级评定表，按部门排序评分并写入「绩效考评汇总表」</p>
    <div class="file-row">
      <label>员工等级评定表</label>
      <input type="file" id="empFile" accept=".xlsx,.xls">
    </div>
    <button class="btn btn-primary" onclick="processEmp()">处理员工汇总</button>
    <div class="status" id="statusEmp"></div>
  </div>

  <div class="divider">或者一次性处理全部</div>

  <!-- All in one -->
  <div class="card">
    <h2>一键处理全部</h2>
    <p class="desc">使用上方已选择的所有文件，依次处理三个表并下载结果</p>
    <button class="btn btn-success" onclick="processAll()">一键处理并下载</button>
    <div class="status" id="statusAll"></div>
  </div>
</div>

<script>
// Heartbeat every 30s keeps the server alive; 2-min timeout on server side
// accommodates browser throttling background tabs to ~1 ping/min
setInterval(() => fetch('/api/heartbeat', {method:'POST'}).catch(()=>{}), 30000);
fetch('/api/heartbeat', {method:'POST'}).catch(()=>{});

// Actively tell the server to shut down when the tab/window is closed
window.addEventListener('beforeunload', () => {
  navigator.sendBeacon('/api/shutdown');
});

function getTarget() {
  const f = document.getElementById('targetFile').files[0];
  if (!f) { alert('请先选择目标文件'); return null; }
  return f;
}

function getDownloadName() {
  const raw = document.getElementById('downloadName').value.trim();
  if (!raw) return 'output.xlsx';
  return raw.endsWith('.xlsx') ? raw : raw + '.xlsx';
}

function setStatus(id, type, msg) {
  const el = document.getElementById(id);
  el.className = 'status show ' + type;
  el.textContent = msg;
}

async function postAndDownload(url, formData, statusId) {
  setStatus(statusId, 'loading', '处理中，请稍候…');
  try {
    const resp = await fetch(url, { method: 'POST', body: formData });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ error: '服务器错误' }));
      setStatus(statusId, 'err', '错误：' + (err.error || resp.statusText));
      return;
    }
    const blob = await resp.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = getDownloadName();
    a.click();
    URL.revokeObjectURL(a.href);
    setStatus(statusId, 'ok', '处理完成，文件已开始下载！');
  } catch (e) {
    setStatus(statusId, 'err', '网络错误：' + e.message);
  }
}

function processDept() {
  const target = getTarget();
  if (!target) return;
  const f1 = document.getElementById('deptRegular').files[0];
  const f2 = document.getElementById('deptLeader').files[0];
  if (!f1 || !f2) { alert('请选择部门考核评定表和领导评定表'); return; }
  const fd = new FormData();
  fd.append('target', target);
  fd.append('file_regular', f1);
  fd.append('file_leader', f2);
  fd.append('download_name', getDownloadName());
  postAndDownload('/api/process/department', fd, 'statusDept');
}

function processMgmt() {
  const target = getTarget();
  if (!target) return;
  const f = document.getElementById('mgmtFile').files[0];
  if (!f) { alert('请选择中层副职考核评定表'); return; }
  const fd = new FormData();
  fd.append('target', target);
  fd.append('file_mgmt', f);
  fd.append('download_name', getDownloadName());
  postAndDownload('/api/process/middlemgmt', fd, 'statusMgmt');
}

function processEmp() {
  const target = getTarget();
  if (!target) return;
  const f = document.getElementById('empFile').files[0];
  if (!f) { alert('请选择员工等级评定表'); return; }
  const fd = new FormData();
  fd.append('target', target);
  fd.append('file_employee', f);
  fd.append('download_name', getDownloadName());
  postAndDownload('/api/process/employee', fd, 'statusEmp');
}

function processAll() {
  const target = getTarget();
  if (!target) return;
  const fd = new FormData();
  fd.append('target', target);
  const f1 = document.getElementById('deptRegular').files[0];
  const f2 = document.getElementById('deptLeader').files[0];
  const fm = document.getElementById('mgmtFile').files[0];
  const fe = document.getElementById('empFile').files[0];
  if (f1) fd.append('file_regular', f1);
  if (f2) fd.append('file_leader', f2);
  if (fm) fd.append('file_mgmt', fm);
  if (fe) fd.append('file_employee', fe);
  if (!f1 && !f2 && !fm && !fe) { alert('请至少选择一个源文件'); return; }
  fd.append('download_name', getDownloadName());
  postAndDownload('/api/process/all', fd, 'statusAll');
}
</script>
</body>
</html>
